<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactive Desktop — preview</title>
<style>
  :root { color-scheme: dark; --bg: #0d0e12; --panel: rgba(20, 22, 30, 0.82); --fg: #e6e7ee; --muted: #9aa0b4; --line: #2a2e3c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wall { position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, #1d2233, #0b0c10 70%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); max-width: calc(100% - 56px); }
  #ui.hidden { display: none; }
  button, select, input[type=range] { font: inherit; color: var(--fg); background: #232737; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button:hover { background: #2d3247; }
  #desc { color: var(--muted); flex-basis: 100%; }
  body.portrait canvas { left: 50%; width: calc(100vh * 9 / 16); transform: translateX(-50%); }
  #rec.on { background: #8c1d2b; }
  #meters { font: 12px ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<div id="wall"></div>
<canvas id="c"></canvas>
<div id="ui">
  <select id="preset" aria-label="Preset"></select>
  <button id="demo">▶ Demo beat</button>
  <button id="mic">🎤 Mic</button>
  <label><button id="fileBtn" type="button">📁 Audio file</button><input id="file" type="file" accept="audio/*" hidden></label>
  <label><button id="wallBtn" type="button">🖼 Wallpaper</button><input id="wallFile" type="file" accept="image/*" hidden></label>
  <label>Intensity <input id="intensity" type="range" min="0" max="2" step="0.05" value="1"></label>
  <button id="rec" title="Record a 1080×1920 clip with audio">⏺ Record 9:16</button>
  <button id="hide" title="Hide UI (H)">Hide</button>
  <span id="meters"></span>
  <div id="desc"></div>
</div>
<script src="../quickshell/analysis.js"></script>
<script src="shaders.generated.js"></script>
<script src="app.js"></script>
</body>
</html>
