[package]
name = "woofer"
version = "0.1.1"
edition = "2024"
description = "Your wallpaper, but alive: an audio-reactive wallpaper daemon for layer-shell Wayland compositors"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
calloop = { version = "0.14", features = ["signals"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl", "naga-ir", "std", "parking_lot"] }
pipewire = "0.10"
naga = { version = "30", features = ["glsl-in"] }
rustfft = "6.4"
realfft = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
inotify = { version = "0.11", default-features = false }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
pollster = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[features]
# Counts heap allocations so --stats can report allocations per frame.
count-alloc = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Quick optimised build for measurements (`--profile measure --features count-alloc`): no LTO, fast to link.
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16
strip = false
